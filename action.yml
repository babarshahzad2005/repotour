name: Repotour codebase tour
description: Keep a codebase tour for new contributors current with a pull request on every release.
author: M. Babar Shahzad
branding:
  icon: map
  color: blue

inputs:
  path:
    description: Where the tour is written, relative to the repository root.
    default: TOUR.md
  format:
    description: Output format, md or html.
    default: md
  llm-api-key:
    description: >-
      Optional API key for AI summaries of key files (for example a free Groq key,
      passed from a repository secret). Without it, the tour has no summaries.
    default: ""
  python-version:
    description: Python used to run Repotour (3.11 or newer).
    default: "3.12"
  token:
    description: Token used to push the branch and open the pull request.
    default: ${{ github.token }}
  dry-run:
    description: If "true", generate the tour and show the diff, but open no pull request.
    default: "false"

outputs:
  changed:
    description: '"true" if the tour differs from the committed one.'
    value: ${{ steps.tour.outputs.changed }}
  pull-request:
    description: URL of the opened or updated pull request, if any.
    value: ${{ steps.pr.outputs.url }}

runs:
  using: composite
  steps:
    - name: Require full history
      shell: bash
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::error::Repotour needs the full git history. In actions/checkout, set 'fetch-depth: 0'."
          exit 1
        fi

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Repotour
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet --disable-pip-version-check "$ACTION_PATH"

    - name: Restore the analysis cache
      uses: actions/cache@v5
      with:
        path: .git/repotour-cache
        key: repotour-${{ runner.os }}-${{ github.sha }}
        restore-keys: repotour-${{ runner.os }}-

    - name: Generate the tour
      id: tour
      shell: bash
      env:
        TOUR_PATH: ${{ inputs.path }}
        TOUR_FORMAT: ${{ inputs.format }}
        REPOTOUR_LLM_API_KEY: ${{ inputs.llm-api-key }}
      run: |
        args=(--format "$TOUR_FORMAT" --out "$TOUR_PATH")
        if [ -n "$REPOTOUR_LLM_API_KEY" ]; then
          args+=(--summaries)
        fi
        repotour "${args[@]}"
        if [ -z "$(git status --porcelain -- "$TOUR_PATH")" ]; then
          echo "The tour is unchanged."
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          git --no-pager diff --stat -- "$TOUR_PATH" || true
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Open or update the pull request
      id: pr
      if: steps.tour.outputs.changed == 'true' && inputs.dry-run != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TOUR_PATH: ${{ inputs.path }}
        BASE: ${{ github.event.repository.default_branch }}
        BRANCH: repotour/update-tour
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -B "$BRANCH"
        git add -- "$TOUR_PATH"
        git commit --quiet -m "docs: update codebase tour"
        git push --force --quiet origin "$BRANCH"
        url=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json url --jq '.[0].url')
        if [ -z "$url" ]; then
          url=$(gh pr create --head "$BRANCH" --base "$BASE" --title "Update codebase tour" \
            --body "Regenerated \`$TOUR_PATH\` with [Repotour](https://github.com/babarshahzad2005/repotour) for $GITHUB_SHA.")
        else
          echo "Updated the existing pull request."
        fi
        echo "url=$url" >> "$GITHUB_OUTPUT"
        echo "Pull request: $url"
