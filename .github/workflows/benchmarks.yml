name: Benchmarks

# Performance targets are measured on real repositories pinned to exact
# commits. Not run on every push: weekly, on demand, and when the benchmark
# itself changes.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "benchmarks/**"
      - ".github/workflows/benchmarks.yml"

permissions:
  contents: read

jobs:
  benchmark:
    name: benchmark (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Run benchmarks
        run: uv run python benchmarks/run.py --dir "$RUNNER_TEMP/bench"
