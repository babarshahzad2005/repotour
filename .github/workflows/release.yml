name: Release

# Builds the package once, checks that the built wheel installs and runs on
# every supported platform, then publishes it with PyPI trusted publishing
# (no stored token). Run it by hand to publish to TestPyPI first; publishing
# a GitHub release publishes to PyPI.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Check the tag matches the version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$TAG" = "v$version" || { echo "::error::Tag $TAG does not match version $version"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  smoke-test:
    name: smoke test (${{ matrix.os }}, py${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Install the wheel and tour this repository
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check dist/*.whl
          cd "$RUNNER_TEMP"
          repotour --help
          repotour "$GITHUB_WORKSPACE" --out tour.md --format md
          repotour "$GITHUB_WORKSPACE" --out tour.html --format html --json tour.json
          head -1 tour.md | grep -qx "<!-- generated by repotour -->"

  testpypi:
    name: publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: smoke-test
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/repotour/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: publish to PyPI
    if: github.event_name == 'release'
    needs: smoke-test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/repotour/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
