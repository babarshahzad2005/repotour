name: Action

# Runs this repository's own GitHub Action against itself, without opening a
# pull request, whenever the action or the code it installs changes.
on:
  pull_request:
    paths:
      - "action.yml"
      - "repotour/**"
      - "pyproject.toml"
      - ".github/workflows/action.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    name: dry run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: markdown
        uses: ./
        with:
          dry-run: "true"
      - id: html
        uses: ./
        with:
          format: html
          path: site/TOUR.html
          dry-run: "true"
      - name: Check the outputs
        shell: bash
        env:
          MD_CHANGED: ${{ steps.markdown.outputs.changed }}
          HTML_CHANGED: ${{ steps.html.outputs.changed }}
          PR_URL: ${{ steps.markdown.outputs.pull-request }}
        run: |
          test "$MD_CHANGED" = "true"
          test "$HTML_CHANGED" = "true"
          test -z "$PR_URL"
          head -1 TOUR.md | grep -qx "<!-- generated by repotour -->"
          grep -q "<!doctype html>" site/TOUR.html

  shallow-clone:
    name: shallow clone is refused
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - id: tour
        uses: ./
        continue-on-error: true
        with:
          dry-run: "true"
      - name: Expect a failure
        shell: bash
        env:
          OUTCOME: ${{ steps.tour.outcome }}
        run: test "$OUTCOME" = "failure"
