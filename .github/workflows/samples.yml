name: Sample tours

# Generates the published sample tours (Flask, Express, fzf at pinned commits)
# and uploads them as an artifact for review. Runs on demand and whenever
# product code or the generator changes, so every code change is also checked
# against three real repositories.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "repotour/**"
      - "benchmarks/samples.py"
      - ".github/workflows/samples.yml"

permissions:
  contents: read

jobs:
  samples:
    name: sample tours
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Generate sample tours
        run: uv run python benchmarks/samples.py --dir "$RUNNER_TEMP/samples" --out sample-tours
      - uses: actions/upload-artifact@v4
        with:
          name: sample-tours
          path: sample-tours/*.md
