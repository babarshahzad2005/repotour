# Robustness corpus: real repositories pinned to exact commits.
# Repotour must tour every one of them without crashing. Run by
# benchmarks/corpus.py in the Corpus workflow (weekly and on demand).
#
# Coverage: the three graph languages, a pnpm monorepo, heavy vendored code
# (pip), heavy migrations (NetBox), a large codebase (Django), a repository
# with no supported language (ripgrep), and one shallow clone (click).
